name: QueryLens
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: ruff check querylens tests_querylens
      - run: ruff format --check querylens tests_querylens
      - run: node --check querylens/static/app.js && node --check querylens/static/upload.js
      - run: pytest
      - run: python -m querylens --eval
